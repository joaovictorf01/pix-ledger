spring.application.name=pix-ledger

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate

# Amounts are in cents. New customer accounts start with R$ 5.000,00 a day.
pixledger.pix.default-daily-limit=500000

# Validation errors use the same problem detail format as domain errors.
spring.mvc.problemdetails.enabled=true

# Treasury. Times are in Brasília.
# Customer Funds go to custody at the closing and come back the next morning;
# overnight the Financial Reserve covers the Instant Payments account.
pixledger.treasury.funds-available-from=08:00
pixledger.treasury.closing-time=18:00
pixledger.treasury.closing-cron=0 0 18 * * *
pixledger.treasury.rebalance-interval=PT5M
# Differences up to R$ 100,00 are left alone, to avoid tiny back-and-forth moves.
pixledger.treasury.tolerance=10000
# R$ 1.000.000,00 of the institution's own money.
pixledger.treasury.reserve-capital=100000000
